services:
  - type: web
    name: conark-systems
    env: python
    buildCommand: ./build_render.sh
    startCommand: PYTHONPATH=src uvicorn conark.api.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: APP_ENV
        value: production
      - key: PYTHONPATH
        value: src
